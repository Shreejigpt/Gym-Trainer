<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="theme-color" content="#0B0B0C">
<title>Trainer</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon-precomposed" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--bg:#0B0B0C;--card:#141416;--card2:#1C1C1F;--line:#2B2B2F;--text:#F2F2F3;--mute:#8A8A8E;--faint:#5C5C61}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);
 font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--text);
 border-radius:7px;padding:8px 10px;width:100%}
input::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:1px solid var(--mute);outline-offset:-1px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.p12{padding:12px}
.hd{padding:20px 0 14px;border-bottom:1px solid var(--line)}
.row{display:flex}.btw{justify-content:space-between}.ctr{align-items:center}.base{align-items:baseline}
.g8{gap:8px}.g10{gap:10px}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt16{margin-top:16px}.mt18{margin-top:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:grid;gap:8px}
.lab{margin:26px 0 10px}
.lab b{display:block;font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.lab i{display:block;font-size:13px;color:var(--faint);font-style:normal;margin-top:3px}
.t1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.t2{font-size:16px;font-weight:600}
.sm{font-size:13px;color:var(--mute)}
.xs{font-size:12px;color:var(--faint)}
.num{font-size:26px;font-weight:700}
.btn{display:block;width:100%;padding:11px 14px;border-radius:8px;font-size:15px;font-weight:600;
 border:1px solid var(--line);text-align:center}
.btn.solid{background:#fff;color:#000;border-color:#fff}
.btn.dim{color:var(--mute)}
.btn.dash{border:1px dashed var(--line);color:var(--mute);font-weight:500;padding:7px}
.ico{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);color:var(--mute);
 font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.set{display:grid;grid-template-columns:22px 1fr 1fr 1fr 36px;gap:8px;align-items:center;padding:3px 0}
.set.head{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding-bottom:4px}
.tick{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);color:var(--faint);
 font-weight:700;margin-left:auto;display:flex;align-items:center;justify-content:center}
.tick.on{background:#fff;border-color:#fff;color:#000}
.chk{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:0 0 auto;
 display:flex;align-items:center;justify-content:center;font-size:12px;color:#000}
.chk.on{background:#fff;border-color:#fff}
.exh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--mute)}
.pill.pr{color:var(--text);font-weight:600}
.bar{background:var(--card2);height:6px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;opacity:.85}
.list button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 0;
 border-bottom:1px solid var(--line);font-size:15px}
.scroll{max-height:280px;overflow-y:auto;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0E0E10;border-top:1px solid var(--line);
 z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:14px 0;color:var(--faint);font-size:13px;position:relative}
nav button.on{color:var(--text);font-weight:600}
nav .dot{position:absolute;top:10px;right:26%;width:5px;height:5px;border-radius:99px;background:#fff}
textarea{height:200px;white-space:pre;font-size:12px;
 font-family:ui-monospace,Menlo,monospace;line-height:1.45}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
/* ---------- library ---------- */
var GROUPS=["Lats","Back","Rear Delts","Shoulders","Chest","Arms","Quads","Hamstrings","Glutes","Calves","Core","Conditioning"];
var LIB=[["Pull-up","Lats"],["Chin-up","Lats"],["Assisted Pull-up","Lats"],["Lat Pulldown (wide)","Lats"],
["Lat Pulldown (neutral)","Lats"],["Straight-Arm Pulldown","Lats"],["DB Pullover","Lats"],
["Barbell Row","Back"],["Pendlay Row","Back"],["One-Arm DB Row","Back"],["Seated Cable Row","Back"],
["One-Arm Cable Row","Back"],["Inverted Row","Back"],
["Face Pull","Rear Delts"],["Bent-Over DB Rear-Delt Fly","Rear Delts"],["Cable Rear-Delt Fly","Rear Delts"],
["Barbell Bench Press","Chest"],["Incline Barbell Press","Chest"],["Flat DB Press","Chest"],
["Incline DB Press","Chest"],["Cable Fly","Chest"],["Dips","Chest"],["Push-up","Chest"],
["Overhead Barbell Press","Shoulders"],["Seated DB Shoulder Press","Shoulders"],
["DB Lateral Raise","Shoulders"],["Cable Lateral Raise","Shoulders"],
["Barbell Curl","Arms"],["EZ-Bar Curl","Arms"],["Incline DB Curl","Arms"],["Hammer Curl","Arms"],
["Cable Curl","Arms"],["Rope Pushdown","Arms"],["Overhead DB Extension","Arms"],["Close-Grip Bench Press","Arms"],
["Back Squat","Quads"],["Front Squat","Quads"],["Bulgarian Split Squat","Quads"],["Walking Lunge","Quads"],
["Goblet Squat","Quads"],["Step-up","Quads"],
["Romanian Deadlift","Hamstrings"],["DB Romanian Deadlift","Hamstrings"],["Conventional Deadlift","Hamstrings"],
["Nordic Curl","Hamstrings"],["Good Morning","Hamstrings"],
["Barbell Hip Thrust","Glutes"],["DB Swing","Glutes"],
["Standing Calf Raise","Calves"],["Seated DB Calf Raise","Calves"],
["Hanging Leg Raise","Core"],["Ab Wheel Rollout","Core"],["Cable Crunch","Core"],["Plank","Core"],["Hollow Hold","Core"],
["Run","Conditioning"],["Skipping Rope","Conditioning"],["Stair Sprints","Conditioning"]]
.map(function(x){return {n:x[0],m:x[1]};});

var WARMUP=["5 min easy cardio","Band or light cable pull-aparts — 2 x 20","Dead hangs — 2 x 20 s","Hip and shoulder circles — 60 s"];
var COOLDOWN=["Lat stretch — 45 s / side","Pec stretch — 45 s / side","Hip flexor and hamstring — 45 s / side"];

function uid(){ return Math.random().toString(36).slice(2,8); }
function mk(n,m,s,r){ return {id:uid(),n:n,m:m,sets:s,reps:r}; }
function defaultPlan(){ return [
 {id:uid(),name:"Upper A",note:"Pull priority",ex:[
   mk("Pull-up","Lats",4,"5–8"),mk("Barbell Bench Press","Chest",4,"6–8"),
   mk("Barbell Row","Back",4,"8–10"),mk("Seated DB Shoulder Press","Shoulders",3,"8–10"),
   mk("Straight-Arm Pulldown","Lats",3,"12–15"),mk("DB Lateral Raise","Shoulders",4,"12–15"),
   mk("Face Pull","Rear Delts",3,"15–20"),mk("Hanging Leg Raise","Core",3,"10–15")]},
 {id:uid(),name:"Lower A",note:"Squat and hinge",ex:[
   mk("Back Squat","Quads",4,"5–6"),mk("Romanian Deadlift","Hamstrings",4,"6–8"),
   mk("Bulgarian Split Squat","Quads",3,"8–10 / leg"),mk("Nordic Curl","Hamstrings",3,"5–8"),
   mk("Standing Calf Raise","Calves",4,"12–15"),mk("Ab Wheel Rollout","Core",3,"8–12")]},
 {id:uid(),name:"Conditioning",note:"Easy aerobic and core",ex:[
   mk("Run","Conditioning",1,"3–4 km easy"),mk("DB Swing","Glutes",4,"12–15"),
   mk("Skipping Rope","Conditioning",6,"60 s on / 60 off"),mk("Plank","Core",3,"45–60 s")]},
 {id:uid(),name:"Back & Rear Delts",note:"The width day",ex:[
   mk("Lat Pulldown (wide)","Lats",4,"8–12"),mk("Seated Cable Row","Back",4,"8–12"),
   mk("One-Arm DB Row","Back",3,"10–12"),mk("Straight-Arm Pulldown","Lats",3,"12–15"),
   mk("Bent-Over DB Rear-Delt Fly","Rear Delts",4,"15–20"),mk("Face Pull","Rear Delts",3,"15–20"),
   mk("EZ-Bar Curl","Arms",3,"8–12"),mk("Rope Pushdown","Arms",3,"10–15")]},
 {id:uid(),name:"Lower B",note:"Posterior chain",ex:[
   mk("Front Squat","Quads",3,"6–8"),mk("Barbell Hip Thrust","Glutes",3,"8–10"),
   mk("Walking Lunge","Quads",3,"10 / leg"),mk("DB Romanian Deadlift","Hamstrings",3,"10–12"),
   mk("Seated DB Calf Raise","Calves",3,"12–15"),mk("Hollow Hold","Core",3,"30–45 s")]},
 {id:uid(),name:"Upper B",note:"Width, rear delts, arms",ex:[
   mk("Chin-up","Lats",3,"6–10"),mk("Incline DB Press","Chest",3,"8–10"),
   mk("One-Arm Cable Row","Back",3,"10–12"),mk("Cable Fly","Chest",3,"12–15"),
   mk("Cable Rear-Delt Fly","Rear Delts",4,"12–15"),mk("Cable Lateral Raise","Shoulders",4,"12–15"),
   mk("Incline DB Curl","Arms",3,"10–12"),mk("Cable Crunch","Core",3,"12–15")]}
]; }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function e1rm(w,r){ return num(w)*(1+num(r)/30); }
function todayISO(){ var d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dObj(s){ return new Date(s+"T00:00:00"); }
function fmtShort(s){ return dObj(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function fmtLong(s){ return dObj(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}); }
function between(a,b){ return Math.round((dObj(b)-dObj(a))/86400000); }
function durTxt(x){ return Math.floor(x/3600)+"h "+String(Math.floor((x%3600)/60)).padStart(2,"0")+"m"; }
function clock(x){ var p=function(v){return String(v).padStart(2,"0");}, h=Math.floor(x/3600);
 return h? h+":"+p(Math.floor((x%3600)/60))+":"+p(x%60) : p(Math.floor(x/60))+":"+p(x%60); }
function bestSets(hist){ var m={};
 hist.forEach(function(w){ w.ex.forEach(function(e){ e.sets.forEach(function(s){
  if(!s.done||num(s.weight)<=0) return; var c=m[e.n];
  if(!c||e1rm(s.weight,s.reps)>e1rm(c.weight,c.reps))
   m[e.n]={weight:num(s.weight),reps:num(s.reps),date:w.date,muscle:e.m};
 });});}); return m; }
function prsFor(sess,prior){ var best=bestSets(prior),hit=[];
 sess.ex.forEach(function(e){ var b=null;
  e.sets.forEach(function(s){ if(s.done&&num(s.weight)>0&&(!b||e1rm(s.weight,s.reps)>e1rm(b.weight,b.reps))) b=s; });
  if(!b) return; var p=best[e.n];
  if(!p||e1rm(b.weight,b.reps)>e1rm(p.weight,p.reps)) hit.push(e.n);
 }); return hit; }
function streakOf(h){ var d=[]; h.forEach(function(w){ if(d.indexOf(w.date)<0) d.push(w.date); });
 d.sort().reverse(); if(!d.length||between(d[0],todayISO())>2) return 0;
 var n=1; for(var i=1;i<d.length;i++){ if(between(d[i],d[i-1])<=2) n++; else break; } return n; }

/* ---------- state ---------- */
var KEY="trainer:v1";
var S={tab:"train",plan:defaultPlan(),history:[],checkins:[],active:null,startedAt:null,
 openDay:null,picking:null,q:"",qGroup:GROUPS[0],confirm:false,copied:false,showText:false};

function load(){ try{ var raw=localStorage.getItem(KEY); if(!raw) return; var d=JSON.parse(raw);
 if(d.plan&&d.plan.length) S.plan=d.plan;
 S.history=d.history||[]; S.checkins=d.checkins||[];
 S.active=d.active||null; S.startedAt=d.startedAt||null; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({plan:S.plan,history:S.history,
 checkins:S.checkins,active:S.active,startedAt:S.startedAt})); }catch(e){} }
function elapsed(){ return S.startedAt? Math.floor((Date.now()-S.startedAt)/1000):0; }
function prevRef(name,i){
 var list=S.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});
 for(var k=0;k<list.length;k++){
  var e=list[k].ex.filter(function(x){return x.n===name;})[0];
  if(e&&e.sets[i]&&num(e.sets[i].weight)>0) return num(e.sets[i].weight)+"×"+num(e.sets[i].reps);
 } return "—"; }
function move(arr,i,d){ var j=i+d; if(j<0||j>=arr.length) return; var x=arr.splice(i,1)[0]; arr.splice(j,0,x); }

function buildLog(){
 var L=[],last=S.checkins.length?S.checkins[S.checkins.length-1]:null;
 L.push("TRAINING LOG — "+fmtLong(todayISO()));
 L.push("Bodyweight: "+(last?last.w+" kg":"not logged")+(last&&last.waist?" · waist "+last.waist+" cm":""));
 L.push(""); L.push("CURRENT PLAN");
 S.plan.forEach(function(d){ L.push("  "+d.name+(d.note?" — "+d.note:""));
  d.ex.forEach(function(e){ L.push("    "+e.n+" ("+e.m+") — "+e.sets+" x "+e.reps); }); });
 L.push(""); L.push("CHECK-INS");
 if(!S.checkins.length) L.push("  none yet");
 S.checkins.slice().reverse().forEach(function(c){
  L.push("  "+fmtShort(c.d)+" — "+c.w+" kg"+(c.waist?" · waist "+c.waist+" cm":"")); });
 var sm={};
 S.history.filter(function(w){return between(w.date,todayISO())<7;})
  .forEach(function(w){ w.ex.forEach(function(e){ sm[e.m]=(sm[e.m]||0)+e.sets.length; }); });
 var sk=Object.keys(sm).sort(function(a,b){return sm[b]-sm[a];});
 L.push(""); L.push("SETS BY MUSCLE — LAST 7 DAYS");
 if(!sk.length) L.push("  nothing logged");
 sk.forEach(function(k){ L.push("  "+k+": "+sm[k]); });
 L.push(""); L.push("SESSIONS ("+S.history.length+", newest first)");
 if(!S.history.length) L.push("  none yet");
 S.history.slice().sort(function(a,b){return a.date<b.date?1:-1;}).forEach(function(w){
  var n=0; w.ex.forEach(function(e){n+=e.sets.length;});
  L.push(""); L.push("  "+fmtShort(w.date)+" — "+w.name+" — "+durTxt(w.dur)+" — "+n+" sets");
  w.ex.forEach(function(e){ L.push("    "+e.n+": "+
   e.sets.map(function(s){return num(s.weight)+"x"+num(s.reps);}).join(", ")+
   ((w.prs||[]).indexOf(e.n)>=0?"  [PR]":"")); });
 });
 L.push(""); L.push("BEST SETS");
 var b=bestSets(S.history);
 var bk=Object.keys(b).sort(function(x,y){return e1rm(b[y].weight,b[y].reps)-e1rm(b[x].weight,b[x].reps);});
 if(!bk.length) L.push("  none yet");
 bk.forEach(function(k){ L.push("  "+k+": "+b[k].weight+" kg × "+b[k].reps+" ("+fmtShort(b[k].date)+")"); });
 return L.join("\n");
}

/* ---------- actions ---------- */
function startDay(id){
 var d=S.plan.filter(function(p){return p.id===id;})[0]; if(!d) return;
 S.startedAt=Date.now(); S.confirm=false;
 S.active={name:d.name,date:todayISO(),
  warm:WARMUP.map(function(){return false;}),cool:COOLDOWN.map(function(){return false;}),
  ex:d.ex.map(function(e){ var sets=[];
   for(var i=0;i<e.sets;i++) sets.push({weight:"",reps:"",done:false});
   return {n:e.n,m:e.m,target:e.sets+" × "+e.reps,sets:sets}; })};
 S.tab="train"; save(); render();
}
function finishSession(){
 var done=S.active.ex.map(function(e){
  return {n:e.n,m:e.m,sets:e.sets.filter(function(s){return s.done;})};
 }).filter(function(e){return e.sets.length;});
 if(!done.length) return;
 var sess={id:uid(),name:S.active.name,date:S.active.date,dur:Math.max(elapsed(),60),ex:done};
 sess.prs=prsFor(sess,S.history);
 S.history.push(sess); S.active=null; S.startedAt=null; S.tab="history"; save(); render();
}
function saveCheckin(){
 var w=document.getElementById("ciW"),wa=document.getElementById("ciWaist");
 if(!w||!num(w.value)) return;
 var t=todayISO();
 S.checkins=S.checkins.filter(function(c){return c.d!==t;});
 S.checkins.push({d:t,w:num(w.value),waist:wa.value===""?null:num(wa.value)});
 S.checkins.sort(function(a,b){return a.d<b.d?-1:1;});
 save(); render();
}
function copyLog(){
 var txt=buildLog();
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(function(){
   S.copied=true; render(); setTimeout(function(){S.copied=false;render();},2200);
  }).catch(function(){ S.showText=true; render(); });
 } else { S.showText=true; render(); }
}

/* ---------- views ---------- */
function lab(t,n){ return '<div class="lab"><b>'+t+'</b>'+(n?'<i>'+n+'</i>':'')+'</div>'; }
function header(){
 var last=S.checkins.length?S.checkins[S.checkins.length-1]:null;
 return '<div class="hd"><div class="row btw base"><div class="t1">Trainer</div>'
  +'<div class="sm">'+(last? last.w+' kg'+(last.waist? ' · '+last.waist+' cm':'') : 'no check-in yet')+'</div></div>'
  +'<div class="xs" style="margin-top:2px">'+S.plan.length+' training days · lats and rear delts are the priority</div></div>';
}
function pickerHTML(ctx,custom){
 var q=S.q.toLowerCase();
 var items=LIB.filter(function(i){ return (i.n+" "+i.m).toLowerCase().indexOf(q)>=0; });
 var exact=items.some(function(i){ return i.n.toLowerCase()===S.q.trim().toLowerCase(); });
 var h='<div class="card p12 mt10"><div class="row btw ctr" style="margin-bottom:8px">'
  +'<div class="t2">Add exercise</div><button class="sm" data-act="closePick">Close</button></div>'
  +'<input id="pq" placeholder="Search or type a new name" value="'+esc(S.q)+'">';
 if(custom && S.q.trim() && !exact){
  h+='<div class="row g8 ctr mt8"><select id="pg" style="flex:1">'
   +GROUPS.map(function(g){ return '<option'+(g===S.qGroup?' selected':'')+'>'+g+'</option>'; }).join("")
   +'</select><button class="btn solid" style="width:auto;padding:8px 14px" data-act="addCustom" data-ctx="'+ctx+'">Add</button></div>';
 }
 h+='<div class="scroll list">'
  +(items.length? items.map(function(i){
     return '<button data-act="pick" data-ctx="'+ctx+'" data-n="'+esc(i.n)+'" data-m="'+esc(i.m)+'">'
      +'<span>'+esc(i.n)+'</span><span class="xs">'+esc(i.m)+'</span></button>';
    }).join("") : '<div class="sm" style="padding:14px 0">No match — type a name to add it.</div>')
  +'</div></div>';
 return h;
}
function checkHTML(title,items,state,key){
 var h='<div class="card p12 mt16"><div class="row btw base"><div class="t2">'+title+'</div>'
  +'<div class="sm">'+state.filter(Boolean).length+'/'+items.length+'</div></div>';
 items.forEach(function(t,i){
  h+='<button class="row ctr g10" style="width:100%;text-align:left;padding:6px 0" data-act="chk" data-key="'+key+'" data-i="'+i+'">'
   +'<span class="chk'+(state[i]?" on":"")+'">'+(state[i]?"&#10003;":"")+'</span>'
   +'<span style="font-size:14px;color:'+(state[i]?"var(--faint)":"var(--text)")+'">'+esc(t)+'</span></button>';
 });
 return h+'</div>';
}
function trainView(){
 if(S.active){
  var a=S.active,done=0,all=0;
  a.ex.forEach(function(e){ all+=e.sets.length; e.sets.forEach(function(s){ if(s.done) done++; }); });
  var h='<div class="row btw" style="align-items:flex-start;padding-top:18px">'
   +'<div><div style="font-size:22px;font-weight:700">'+esc(a.name)+'</div>'
   +'<div class="sm">'+fmtLong(a.date)+'</div></div>'
   +'<div style="text-align:right"><div id="timer" style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">'+clock(elapsed())+'</div>'
   +'<div class="sm">'+done+'/'+all+' sets</div></div></div>';
  h+=checkHTML("Warm-up",WARMUP,a.warm,"warm");
  a.ex.forEach(function(e,ei){
   h+='<div class="card mt10" style="overflow:hidden"><div class="exh">'
    +'<div style="min-width:0"><div class="t2">'+esc(e.n)+'</div>'
    +'<div class="sm">'+esc(e.m)+' · '+esc(e.target)+'</div></div>'
    +'<button class="ico" data-act="rmEx" data-ei="'+ei+'">&#10005;</button></div>'
    +'<div style="padding:8px 12px 10px">'
    +'<div class="set head"><div>#</div><div>Prev</div><div>Kg</div><div>Reps</div><div></div></div>';
   e.sets.forEach(function(s,si){
    h+='<div class="set"><div style="font-size:14px;font-weight:600;color:'+(s.done?"var(--text)":"var(--mute)")+'">'+(si+1)+'</div>'
     +'<div class="xs">'+prevRef(e.n,si)+'</div>'
     +'<input type="number" inputmode="decimal" placeholder="—" value="'+esc(s.weight)+'" data-f="weight" data-ei="'+ei+'" data-si="'+si+'">'
     +'<input type="number" inputmode="numeric" placeholder="—" value="'+esc(s.reps)+'" data-f="reps" data-ei="'+ei+'" data-si="'+si+'">'
     +'<button class="tick'+(s.done?" on":"")+'" data-act="tick" data-ei="'+ei+'" data-si="'+si+'">&#10003;</button></div>';
   });
   h+='<button class="btn dash mt8" data-act="addSet" data-ei="'+ei+'">Add set</button></div></div>';
  });
  h+= (S.picking==="session")? pickerHTML("session",true)
     : '<button class="btn mt10" data-act="openPick" data-ctx="session">Add exercise to this session</button>';
  h+=checkHTML("Cool-down",COOLDOWN,a.cool,"cool");
  h+='<div class="grid2 mt18"><button class="btn solid" style="opacity:'+(done?1:.35)+'" data-act="finish">Finish</button>'
   +'<button class="btn '+(S.confirm?"":"dim")+'" data-act="discard">'+(S.confirm?"Tap again to discard":"Discard")+'</button></div>';
  return h;
 }
 var week=S.history.filter(function(w){return between(w.date,todayISO())<7;}).length;
 var st=[[streakOf(S.history),"Streak"],[week,"This week"],[S.history.length,"Total"]];
 var h='<div class="grid3" style="padding-top:18px">'
  +st.map(function(s){ return '<div class="card p12"><div class="num">'+s[0]+'</div><div class="xs" style="margin-top:2px">'+s[1]+'</div></div>'; }).join("")
  +'</div>';
 h+=lab("Today","Tap a day to start logging it.");
 h+='<div class="stack">';
 if(!S.plan.length) h+='<div class="card p12 sm">No days yet. Add one on the Plan tab.</div>';
 S.plan.forEach(function(d){
  h+='<button class="card p12 row btw ctr g10" style="text-align:left" data-act="start" data-id="'+d.id+'">'
   +'<span style="min-width:0"><span class="t2" style="display:block">'+esc(d.name)+'</span>'
   +'<span class="sm" style="display:block">'+(d.note?esc(d.note)+' · ':'')+d.ex.length+' exercises</span></span>'
   +'<span class="sm" style="font-size:18px">&rsaquo;</span></button>';
 });
 return h+'</div>';
}
function planView(){
 var h=lab("Your plan","Rename days, reorder, add or remove exercises. Changes apply next time you start that day.");
 S.plan.forEach(function(d,di){
  var open=S.openDay===d.id;
  h+='<div class="card p12" style="margin-bottom:8px">'
   +'<div class="row g8 ctr"><input value="'+esc(d.name)+'" style="font-weight:600" data-df="name" data-di="'+di+'">'
   +'<button class="ico" data-act="dayUp" data-di="'+di+'">&#8593;</button>'
   +'<button class="ico" data-act="dayDown" data-di="'+di+'">&#8595;</button></div>'
   +'<input class="mt6 sm" placeholder="Short note (optional)" value="'+esc(d.note||"")+'" data-df="note" data-di="'+di+'">'
   +'<div class="row btw ctr mt10">'
   +'<button style="font-size:14px" data-act="toggleDay" data-id="'+d.id+'">'+(open?"Hide":"Edit")+' '+d.ex.length+' exercises</button>'
   +'<button class="sm" data-act="delDay" data-di="'+di+'">Delete day</button></div>';
  if(open){
   h+='<div class="mt10" style="border-top:1px solid var(--line);padding-top:10px">';
   d.ex.forEach(function(e,ei){
    h+='<div style="margin-bottom:10px"><div class="row g8 ctr">'
     +'<div style="flex:1;min-width:0"><div style="font-size:15px">'+esc(e.n)+'</div><div class="xs">'+esc(e.m)+'</div></div>'
     +'<button class="ico" data-act="exUp" data-di="'+di+'" data-ei="'+ei+'">&#8593;</button>'
     +'<button class="ico" data-act="exDown" data-di="'+di+'" data-ei="'+ei+'">&#8595;</button>'
     +'<button class="ico" data-act="exDel" data-di="'+di+'" data-ei="'+ei+'">&#10005;</button></div>'
     +'<div style="display:grid;grid-template-columns:70px 1fr;gap:8px;margin-top:6px">'
     +'<input type="number" inputmode="numeric" value="'+e.sets+'" data-ef="sets" data-di="'+di+'" data-ei="'+ei+'">'
     +'<input value="'+esc(e.reps)+'" placeholder="reps, e.g. 8–10" data-ef="reps" data-di="'+di+'" data-ei="'+ei+'">'
     +'</div></div>';
   });
   h+= (S.picking===d.id)? pickerHTML(d.id,true)
      : '<button class="btn" style="margin-top:4px" data-act="openPick" data-ctx="'+d.id+'">Add exercise</button>';
   h+='</div>';
  }
  h+='</div>';
 });
 return h+'<button class="btn solid mt10" data-act="addDay">Add a day</button>';
}
function historyView(){
 var list=S.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});
 if(!list.length) return '<div style="padding-top:60px;text-align:center"><div class="t2">No sessions yet</div>'
  +'<div class="sm mt6">Finished workouts appear here.</div></div>';
 var h=lab(list.length+" sessions")+'<div class="stack">';
 list.forEach(function(w){
  var n=0; w.ex.forEach(function(e){n+=e.sets.length;});
  h+='<div class="card p12"><div class="row btw base"><div class="t2">'+esc(w.name)+'</div>'
   +'<div class="sm">'+fmtShort(w.date)+'</div></div>'
   +'<div class="sm" style="margin-bottom:8px">'+durTxt(w.dur)+' · '+n+' sets · '+w.ex.length+' exercises</div>'
   +'<div class="row" style="flex-wrap:wrap;gap:6px">'
   +w.ex.map(function(e){ var pr=(w.prs||[]).indexOf(e.n)>=0;
     return '<span class="pill'+(pr?" pr":"")+'">'+(pr?"&#9733; ":"")+esc(e.n)+'</span>'; }).join("")
   +'</div></div>';
 });
 return h+'</div>';
}
function progressView(){
 var h=lab("Check-in","Waist at navel level, same time of day as the scale.");
 h+='<div class="card p12"><div class="grid2">'
  +'<input id="ciW" type="number" inputmode="decimal" placeholder="Weight kg">'
  +'<input id="ciWaist" type="number" inputmode="decimal" placeholder="Waist cm"></div>'
  +'<button class="btn solid mt8" data-act="checkin">Save check-in</button>';
 S.checkins.slice().reverse().slice(0,6).forEach(function(c){
  h+='<div class="row btw sm" style="padding:6px 0;border-top:1px solid var(--line)">'
   +'<span>'+fmtShort(c.d)+'</span><span style="color:var(--text)">'+c.w+' kg'+(c.waist?' · '+c.waist+' cm':'')+'</span></div>';
 });
 h+='</div>';
 var sets={};
 S.history.filter(function(w){return between(w.date,todayISO())<7;})
  .forEach(function(w){ w.ex.forEach(function(e){ sets[e.m]=(sets[e.m]||0)+e.sets.length; }); });
 var rows=Object.keys(sets).sort(function(a,b){return sets[b]-sets[a];});
 var max=rows.length?sets[rows[0]]:1;
 h+=lab("Sets by muscle, last 7 days","Lats, Back and Rear Delts should out-total your pressing.");
 h+='<div class="card p12">';
 if(!rows.length) h+='<div class="sm">Nothing logged in the last seven days.</div>';
 rows.forEach(function(m){
  h+='<div style="margin-bottom:9px"><div class="row btw" style="font-size:13px;margin-bottom:4px">'
   +'<span>'+esc(m)+'</span><span class="sm">'+sets[m]+'</span></div>'
   +'<div class="bar"><i style="width:'+(sets[m]/max*100)+'%"></i></div></div>';
 });
 h+='</div>';
 var b=bestSets(S.history);
 var top=Object.keys(b).map(function(n){ var v=b[n]; v.n=n; return v; })
  .sort(function(x,y){return e1rm(y.weight,y.reps)-e1rm(x.weight,x.reps);}).slice(0,5);
 h+=lab("Best sets")+'<div class="card p12">';
 if(!top.length) h+='<div class="sm">Log a session and your records show up here.</div>';
 top.forEach(function(p,i){
  h+='<div class="row btw base" style="padding:7px 0;'+(i?"border-top:1px solid var(--line)":"")+'">'
   +'<span style="min-width:0"><span style="display:block;font-size:15px">'+esc(p.n)+'</span>'
   +'<span class="xs">'+fmtShort(p.date)+'</span></span>'
   +'<span style="font-size:15px;font-weight:600">'+p.weight+' × '+p.reps+'</span></div>';
 });
 h+='</div>';
 h+=lab("Export","Paste into your training doc so nothing is lost.");
 h+='<div class="card p12"><button class="btn" data-act="copy">'+(S.copied?"Copied":"Copy full log")+'</button>'
  +'<button class="btn dim" style="border:none;margin-top:6px" data-act="showText">'+(S.showText?"Hide text":"Show text instead")+'</button>'
  +(S.showText? '<textarea class="mt8" readonly onfocus="this.select()">'+esc(buildLog())+'</textarea>':'')
  +'</div>';
 return h;
}
function navHTML(){
 return [["train","Train"],["plan","Plan"],["history","History"],["progress","Progress"]].map(function(i){
  return '<button class="'+(S.tab===i[0]?"on":"")+'" data-act="tab" data-tab="'+i[0]+'">'+i[1]
   +(i[0]==="train"&&S.active?'<span class="dot"></span>':'')+'</button>';
 }).join("");
}

/* ---------- render + events ---------- */
var app=document.getElementById("app"), navEl=document.getElementById("nav");
var scrollMemo={};
function render(){
 var v = S.tab==="train"? trainView() : S.tab==="plan"? planView()
       : S.tab==="history"? historyView() : progressView();
 app.innerHTML = header()+v;
 navEl.innerHTML = navHTML();
 var pq=document.getElementById("pq");
 if(pq && S.picking!==null){ pq.focus(); pq.setSelectionRange(pq.value.length,pq.value.length); }
}
window.addEventListener("scroll",function(){ scrollMemo[S.tab]=window.scrollY; });

document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-act]"); if(!t) return;
 var a=t.getAttribute("data-act");
 var di=+t.getAttribute("data-di"), ei=+t.getAttribute("data-ei"), si=+t.getAttribute("data-si");

 if(a==="tab"){ S.tab=t.getAttribute("data-tab"); S.confirm=false; render(); }
 else if(a==="start"){ startDay(t.getAttribute("data-id")); }
 else if(a==="tick"){ var s=S.active.ex[ei].sets[si]; s.done=!s.done; save(); render(); }
 else if(a==="addSet"){ S.active.ex[ei].sets.push({weight:"",reps:"",done:false}); save(); render(); }
 else if(a==="rmEx"){ S.active.ex.splice(ei,1); save(); render(); }
 else if(a==="chk"){ var k=t.getAttribute("data-key"), i=+t.getAttribute("data-i");
   S.active[k][i]=!S.active[k][i]; save(); render(); }
 else if(a==="finish"){ finishSession(); }
 else if(a==="discard"){ if(S.confirm){ S.active=null; S.startedAt=null; S.confirm=false; save(); }
   else S.confirm=true; render(); }
 else if(a==="openPick"){ S.picking=t.getAttribute("data-ctx"); S.q=""; render(); }
 else if(a==="closePick"){ S.picking=null; S.q=""; render(); }
 else if(a==="pick"||a==="addCustom"){
   var n,m,ctx=t.getAttribute("data-ctx");
   if(a==="pick"){ n=t.getAttribute("data-n"); m=t.getAttribute("data-m"); }
   else { n=S.q.trim(); var g=document.getElementById("pg"); m=g?g.value:S.qGroup; if(!n) return; }
   if(ctx==="session"&&S.active){
     S.active.ex.push({n:n,m:m,target:"3 × 8–12",
       sets:[{weight:"",reps:"",done:false},{weight:"",reps:"",done:false},{weight:"",reps:"",done:false}]});
   } else {
     var d=S.plan.filter(function(p){return p.id===ctx;})[0];
     if(d) d.ex.push({id:uid(),n:n,m:m,sets:3,reps:"8–12"});
   }
   S.picking=null; S.q=""; save(); render();
 }
 else if(a==="toggleDay"){ var id=t.getAttribute("data-id");
   S.openDay = S.openDay===id? null : id; S.picking=null; render(); }
 else if(a==="dayUp"){ move(S.plan,di,-1); save(); render(); }
 else if(a==="dayDown"){ move(S.plan,di,1); save(); render(); }
 else if(a==="delDay"){ S.plan.splice(di,1); save(); render(); }
 else if(a==="addDay"){ var nd={id:uid(),name:"New day",note:"",ex:[]};
   S.plan.push(nd); S.openDay=nd.id; save(); render(); }
 else if(a==="exUp"){ move(S.plan[di].ex,ei,-1); save(); render(); }
 else if(a==="exDown"){ move(S.plan[di].ex,ei,1); save(); render(); }
 else if(a==="exDel"){ S.plan[di].ex.splice(ei,1); save(); render(); }
 else if(a==="checkin"){ saveCheckin(); }
 else if(a==="copy"){ copyLog(); }
 else if(a==="showText"){ S.showText=!S.showText; render(); }
});

/* typing never re-renders, so the keyboard and cursor stay put */
document.addEventListener("input",function(ev){
 var el=ev.target;
 if(el.id==="pq"){ S.q=el.value; var old=S.picking; render(); return; }
 if(el.id==="pg"){ S.qGroup=el.value; return; }
 var f=el.getAttribute("data-f");
 if(f&&S.active){ S.active.ex[+el.getAttribute("data-ei")].sets[+el.getAttribute("data-si")][f]=el.value; save(); return; }
 var df=el.getAttribute("data-df");
 if(df){ S.plan[+el.getAttribute("data-di")][df]=el.value; save(); return; }
 var ef=el.getAttribute("data-ef");
 if(ef){ var d=S.plan[+el.getAttribute("data-di")], e=d.ex[+el.getAttribute("data-ei")];
   e[ef] = ef==="sets" ? Math.max(1,num(el.value)||1) : el.value; save(); return; }
});

setInterval(function(){ var t=document.getElementById("timer");
 if(t&&S.active) t.textContent=clock(elapsed()); },1000);

load();
if(S.active&&!S.startedAt) S.startedAt=Date.now();
render();

</script>
</body>
</html>
